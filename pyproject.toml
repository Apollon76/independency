[project]
name = "independency"
version = "1.4"
description = "Dependency injection container"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "apollon", email = "Apollon76@yandex.ru"},
    {name = "ashibaev", email = "ashibaev98@yandex.ru"}
]

[project.urls]
Repository = "https://github.com/Apollon76/independency"

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "mypy>=1.13.0",
    "flake8-awesome>=1.3.0",
    "pytest>=8.0.0",
    "pylint>=3.3.0",
    "pytest-cov>=6.0.0",
    "isort>=5.0.0",
    "setuptools>=75.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ['py310', 'py311', 'py312', 'py313']
line-length = 120

